[project]
name = "python-dev-quest"
version = "0.1.0"
description = "Gamified Python backend training environment (Python Developer Quest)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
]
fastapi = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
]
db = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
]
django = [
    "django>=5.1",
    "djangorestframework>=3.15",
]
messaging = [
    "pika>=1.3",
    "confluent-kafka>=2.6",
]
data = [
    "pandas>=2.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
